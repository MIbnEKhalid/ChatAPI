<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="AI Chat Application by mbktech.org - Chat with DeepSeek models" />
    <title>ChatAPI | mbktech.org</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;300;400;500;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Prevent flash of wrong theme before React mounts
      try {
        var s = JSON.parse(localStorage.getItem('mbk_chat_settings'));
        if (s && s.colorScheme === 'dark') document.documentElement.classList.add('dark');
      } catch(e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
